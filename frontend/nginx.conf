server {
    listen       80;
    server_name  localhost;

    # 静态文件
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA 路由：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 → Agent 后端
    location /agent/ {
        proxy_pass http://cpq-agent-backend:58100/agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://cpq-agent-backend:58100/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /config {
        proxy_pass http://cpq-agent-backend:58100/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /sessions {
        proxy_pass http://cpq-agent-backend:58100/sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
