model:
  provider: deepseek
  model_name: deepseek-v4-pro
  api_key: sk-5cefe4230add4f939357147790cec49c
  base_url: https://api.deepseek.com
  temperature: 0.7
  max_tokens: 8192
  top_p: 0.9
cpq:
  base_url: http://localhost:30000
  client_id: e5cd7e4891bf95d1d19206ce24a7b32e
  username: admin
  password: admin123
  timeout: 30
  max_retries: 3
agent:
  system_prompt: ''
  max_turns: 10
  enable_subagents: true
memory:
  storage_path: ./data/memory
  preferences_file: preferences.md
  max_file_size_kb: 500
skills:
  paths:
  - ./backend/skills/cpq-agent
  - ./backend/skills/product-search
  - ./backend/skills/bom-config
  - ./backend/skills/pricing-rules
human_in_loop:
  interrupt_on:
    create_quote: true
    send_quote: true
security:
  backend: state
  permissions:
    allow_paths:
    - ./workspace/**
    deny_paths:
    - ./config/**
    - ./data/**/*.key
logging:
  level: info
  file: ./logs/agent.log
  max_size_mb: 10
  backup_count: 3
ui:
  language: zh-CN
  theme: auto
  typewriter_delay_ms: 20
  history_retention_days: 30
