name: Docker CI — Build & Package

on:
  push:
    branches: [main, v4-deploy]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stormyangyf2026/cpq_agent

jobs:
  # ── Job 1: Docker 后端镜像 ──
  docker-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cpq-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cpq-backend:${{ github.sha }}

      - name: 导出镜像为文件（供离线部署下载）
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cpq-backend:latest
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cpq-backend:latest | gzip > cpq-agent-backend.tar.gz

      - name: 上传镜像文件
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cpq-agent-backend-image
          path: cpq-agent-backend.tar.gz
          retention-days: 30

  # ── Job 2: Windows 桌面版 ──
  build-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: cd backend && pip install -r requirements.txt pyinstaller && pyinstaller cpq-backend-win.spec --clean
      - uses: actions/upload-artifact@v4
        with: { name: cpq-backend-exe, path: backend/dist/cpq-backend.exe, retention-days: 7 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd frontend && npm install && npm run electron:build:win
      - uses: actions/upload-artifact@v4
        with: { name: cpq-agent-windows, path: frontend/release/*.zip, retention-days: 30 }

  # ── Job 3: Linux 前端 + 部署配置 ──
  package-linux:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd frontend && npm install && npm run build -- --mode staging
      - run: |
          mkdir deploy
          cp -r frontend/dist deploy/agent-frontend
          cp config/staging/config.yaml deploy/agent-config.yaml
          cp docker-compose.agent.yml deploy/
          cd deploy && tar czf ../cpq-agent-deploy.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: cpq-agent-linux-deploy, path: cpq-agent-deploy.tar.gz, retention-days: 30 }

  # ── Job 4: Release ──
  release:
    needs: [build-windows, package-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cpq-agent-windows }
      - uses: softprops/action-gh-release@v2
        with: { files: '*.zip', generate_release_notes: true }
